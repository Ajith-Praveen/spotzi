name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotzi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: spotzi/constraints.txt
      - name: Install
        run: pip install -r requirements.txt -c constraints.txt ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests (SQLite)
        run: python -m unittest discover -s tests -v
