[project]
name = "spotzi"
description = "SpotZⁱ — ClaimShield Nexus: evidence-first healthcare claims FWA intelligence for SIU review"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "static"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E4/E7/E9) and import order (I)
select = ["F", "E4", "E7", "E9", "I"]
# E731: short lambdas are used as local helpers; E741: `l` is the conventional name for a claim line
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "api", "detection", "evaluation", "infra", "intelligence", "operations", "scripts", "synthdata"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
# tests point the app at a throw-away database and stub the LLM *before* importing SpotZⁱ modules
"tests/*" = ["E402"]
